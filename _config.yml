title: Learn Python for Smart Systems
author: Emertxe Information Technologies
description: A beginner's Python tutorial — learn by building a real IoT smart energy system

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/EmertxeInfoTech/learn-python-for-smart-systems
  path_to_book: .
  branch: main

launch_buttons:
  notebook_interface: "classic"
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"
  thebe: false

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true
  favicon: ""

sphinx:
  config:
    html_theme_options:
      use_binder_button: true
      use_colab_button: true
      repository_url: "https://github.com/EmertxeInfoTech/learn-python-for-smart-systems"
      repository_branch: "main"
      path_to_docs: "."
      launch_buttons:
        notebook_interface: "classic"
        binderhub_url: "https://mybinder.org"
        colab_url: "https://colab.research.google.com"
      show_navbar_depth: 2
      navigation_with_keys: true
